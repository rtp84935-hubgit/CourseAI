
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leukemia Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #090909, #180b0b, #2b1010);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading h1 {
            font-size: 32px;
            color: #ff4d4d;
            margin-bottom: 8px;
        }

        .heading p {
            color: #bbb;
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        .input-box label {
            font-size: 14px;
            color: #ddd;
            margin-bottom: 8px;
        }

        .input-box input,
        .input-box select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #444;
            border-radius: 10px;
            outline: none;
            background: #151515;
            color: white;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-box input:focus,
        .input-box select:focus {
            border-color: #ff4d4d;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.2);
        }

        .input-box select option {
            background: #151515;
            color: white;
        }

        .button-area {
            text-align: center;
            margin-top: 30px;
        }

        .predict-btn {
            padding: 14px 45px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff3131, #a80000);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .predict-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 49, 49, 0.35);
        }

        .result-box {
            margin-top: 35px;
            padding: 22px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 77, 77, 0.35);
            text-align: center;
        }

        .result-box h2 {
            color: #ff4d4d;
            margin-bottom: 12px;
            font-size: 20px;
        }

        .result {
            font-size: 25px;
            font-weight: bold;
            color: #fff;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px 18px;
            }

            .heading h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="heading">
        <h1>🩸 Leukemia Prediction</h1>
        <p>Enter the patient's details to predict Leukemia Status</p>
    </div>

    <form action="/myapp/leukemiapost/" method="post">

        {% csrf_token %}

        <div class="form-grid">

            <!-- Age -->
            <div class="input-box">
                <label>Age</label>
                <input type="number"
                       name="Age"
                       placeholder="Enter age"
                       min="1"
                       required>
            </div>

            <!-- Gender -->
            <div class="input-box">
                <label>Gender</label>
                <select name="Gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <!-- WBC Count -->
            <div class="input-box">
                <label>WBC Count</label>
                <input type="number"
                       step="any"
                       name="WBC_Count"
                       placeholder="Enter WBC count"
                       required>
            </div>

            <!-- RBC Count -->
            <div class="input-box">
                <label>RBC Count</label>
                <input type="number"
                       step="any"
                       name="RBC_Count"
                       placeholder="Enter RBC count"
                       required>
            </div>

            <!-- Platelet Count -->
            <div class="input-box">
                <label>Platelet Count</label>
                <input type="number"
                       step="any"
                       name="Platelet_Count"
                       placeholder="Enter platelet count"
                       required>
            </div>

            <!-- Hemoglobin -->
            <div class="input-box">
                <label>Hemoglobin Level</label>
                <input type="number"
                       step="any"
                       name="Hemoglobin_Level"
                       placeholder="Enter hemoglobin level"
                       required>
            </div>

            <!-- Bone Marrow Blasts -->
            <div class="input-box">
                <label>Bone Marrow Blasts (%)</label>
                <input type="number"
                       step="any"
                       name="Bone_Marrow_Blasts"
                       placeholder="Enter blast percentage"
                       min="0"
                       max="100"
                       required>
            </div>

            <!-- Genetic Mutation -->
            <div class="input-box">
                <label>Genetic Mutation</label>
                <select name="Genetic_Mutation" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <!-- Family History -->
            <div class="input-box">
                <label>Family History</label>
                <select name="Family_History" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <!-- Smoking Status -->
            <div class="input-box">
                <label>Smoking Status</label>
                <select name="Smoking_Status" required>
                    <option value="">Select</option>
                    <option value="Never">Never</option>
                    <option value="Former">Former</option>
                    <option value="Current">Current</option>
                </select>
            </div>

            <!-- Alcohol Consumption -->
            <div class="input-box">
                <label>Alcohol Consumption</label>
                <select name="Alcohol_Consumption" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <!-- Radiation Exposure -->
            <div class="input-box">
                <label>Radiation Exposure</label>
                <select name="Radiation_Exposure" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <!-- Infection History -->
            <div class="input-box">
                <label>Infection History</label>
                <select name="Infection_History" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <!-- BMI -->
            <div class="input-box">
                <label>BMI</label>
                <input type="number"
                       step="any"
                       name="BMI"
                       placeholder="Enter BMI"
                       required>
            </div>

            <!-- Chronic Illness -->
            <div class="input-box">
                <label>Chronic Illness</label>
                <select name="Chronic_Illness" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <!-- Immune Disorders -->
            <div class="input-box">
                <label>Immune Disorders</label>
                <select name="Immune_Disorders" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <!-- Ethnicity -->
            <div class="input-box">
                <label>Ethnicity</label>
                <select name="Ethnicity" required>
                    <option value="">Select Ethnicity</option>
                    <option value="Asian">Asian</option>
                    <option value="Black">Black</option>
                    <option value="White">White</option>
                    <option value="Hispanic">Hispanic</option>
                    <option value="Other">Other</option>
                </select>
            </div>

        </div>

        <div class="button-area">
            <button type="submit" class="predict-btn">
                Predict Leukemia Status
            </button>
        </div>

    </form>


    {% if result %}

    <div class="result-box">
        <h2>Prediction Result</h2>
        <div class="result">
            {{ result }}
        </div>
    </div>

    {% endif %}

</div>

</body>
</html>
